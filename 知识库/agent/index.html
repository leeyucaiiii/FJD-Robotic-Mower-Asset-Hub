<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FJD Robotic Mower Asset Hub</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar panel">
      <div class="brand-block">
        <p class="eyebrow">Sales Material Library</p>
        <h1>FJD Robotic Mower Asset Hub</h1>
      </div>

      <label class="search-box" for="productSearch">
        <span>Product Search</span>
        <input id="productSearch" type="search" placeholder="Search by product, scenario, or model">
      </label>

      <div class="sidebar-section">
        <div class="section-heading">
          <h2>Products</h2>
          <span id="sidebarCount" class="badge"></span>
        </div>
        <div id="sidebarList" class="sidebar-list"></div>
      </div>
    </aside>

    <main class="workspace">
      <section class="hero panel">
        <div class="hero-copy">
          <h2 id="heroTitle">Loading...</h2>
          <p id="heroSlogan" class="hero-slogan"></p>
          <p id="heroDescription" class="hero-description"></p>
          <div id="heroMeta" class="chip-row"></div>
        </div>
      </section>

      <div class="workspace-grid">
        <div class="main-column">
          <section id="materialsSection" class="panel materials-panel">
            <div id="materialGroups" class="material-groups"></div>
          </section>

          <section class="summary-grid">
            <article class="panel">
              <div class="section-heading">
                <h3>Core Highlights</h3>
              </div>
              <div id="highlightsList" class="highlight-list"></div>
            </article>
            <article class="panel">
              <div class="section-heading">
                <h3>Competitor Reference</h3>
              </div>
              <div id="competitorList" class="pill-list"></div>
            </article>
          </section>
        </div>

        <aside class="preview-column">
          <section class="panel preview-panel">
            <div class="section-heading wide preview-heading">
              <div>
                <p class="section-kicker">Live Preview</p>
                <h3 id="previewTitle">Material Preview</h3>
              </div>
              <a id="previewOpenLink" class="action-button ghost" href="#" target="_blank" rel="noreferrer">Open Source File</a>
            </div>
            <div id="previewMeta" class="preview-meta"></div>
            <div id="previewContainer" class="preview-container"></div>
          </section>
        </aside>
      </div>
    </main>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
